[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuttireporting"
dynamic = ["version"]
description = "Declarative, editable LaTeX reports for scientific runs and bibliometric analyses."
readme = "README.md"
authors = [{ name = "Romain Thomas", email = "contact@romainthomas.net" }]
license = "GPL-3.0-only"
license-files = [
    "LICENSE.txt"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed"
]
keywords = ["tutti", "Data analysis", "Scientific research", "LaTeX"]
dependencies = [
    "jinja2>=3.1,<4",
    "tomli>=2; python_version < '3.11'",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-xdist>=3.6,<4", "filelock>=3.13,<4"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "pdf: offline tests requiring LaTeX tools",
    "live: integration tests requiring network access and example dependencies",
]

[tool.setuptools.packages.find]
include = ["tuttireporting*"]

[tool.setuptools.package-data]
tuttireporting = ["catalog/*/*.toml", "templates/*.j2", "templates/*.toml", "templates/*/*.tex", "templates/*/*.toml", "templates/*/tutti/*.cls"]

[project.scripts]
tuttireporting = "tuttireporting.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tuttireporting._version.__version__" }

[project.urls]
Repository = "https://github.com/romain894/tuttireporting"
