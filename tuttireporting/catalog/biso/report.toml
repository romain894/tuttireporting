# BiSO layout. Selectors match figure stems and stats_to_save aliases.
# The producer supplies plain-text values and PDF/PNG/JPEG figures.
[report]
title = "Bilan de science ouverte"
template = "biso"

[[sections]]
title = "Périmètre du rapport"
paragraphs = [
  "Ce bilan porte sur l’entité {{config.entity_id}}.",
  "L’année de référence du rapport est {{config.year}}.",
  "L’établissement étudié est {{config.entity_full_name}}.",
  "Son sigle est {{config.entity_acronym}}.",
]

[[sections]]
title = "Publications et accès ouvert"
new_page = true

[[sections.sections]]
title = "Types de publications"
paragraphs = ["Le corpus comprend {{stats.publications}} publications."]
plots = ["works_type"]

[[sections.sections]]
title = "Accès ouvert"
paragraphs = ["L’évolution de l’accès ouvert est présentée sur la période {{stats.oaworksperiod}}."]
plots = ["open_access_works"]

[[sections.sections]]
title = "Revues de publication"
paragraphs = [
  "L’analyse des revues porte sur {{stats.bsojournalsnbworks}} publications.",
  "Le rapprochement avec le Baromètre de la science ouverte a permis de retrouver {{stats.bsojournalsnbworksfoundinbso}} publications.",
  "Le corpus couvre {{stats.bsojournalsnbjournals}} revues.",
  "La version du Baromètre de la science ouverte utilisée est {{stats.bsojournalsbsoversion}}.",
]
plots = ["journals", "journals_hal"]

[[sections.sections]]
title = "Chapitres d’ouvrages"
plots = ["chapters"]

[[sections.sections]]
title = "Conférences"
plots = ["conferences"]

[[sections]]
title = "Collaborations"
new_page = true

[[sections.sections]]
title = "Collaborations internationales"
paragraphs = [
  "L’analyse recense {{stats.collaborationsnb}} collaborations.",
  "Les collaborations concernent {{stats.institutionsnb}} institutions.",
  "Les partenaires sont répartis dans {{stats.countriesnb}} pays.",
]
plots = ["collaboration_map_world", "collaboration_map_europe", "collaboration_names"]

[[sections.sections]]
title = "Collaborations avec le secteur privé"
plots = ["private_sector_collaborations"]

[[sections]]
title = "Projets de recherche"
new_page = true
plots = ["anr_projects", "european_projects"]

# WorksBibtex settings are preserved in producer.toml as a reference.
# Bibliography assembly is not implemented by the declarative builder.
