# BiSO layout mirroring the original static report order and headings.
[report]
title = "Bilan de science ouverte"
template = "biso"
author = "Direction des bibliothèques, de l'information et de la science ouverte"

[[sections]]
title = "Liste des revues"
plots = ["journals_hal"]

[[sections]]
title = "Liste des conférences"
new_page = true
plots = ["conferences"]

[[sections]]
title = "Liste des chapitres"
new_page = true
plots = ["chapters"]

[[sections]]
title = "Typologie de la production scientifique"
new_page = true
paragraphs = ["Le corpus comprend {{stats.publications}} publications."]
plots = ["works_type"]

[[sections]]
title = "Articles et Communications de congrès en accès ouvert"
new_page = true
paragraphs = ["L’évolution de l’accès ouvert est présentée sur la période {{stats.oaworksperiod}}."]
plots = ["open_access_works"]

[[sections]]
title = "Liste des revues et les voies d'accès ouvert repérés dans le BSO"
new_page = true
paragraphs = [
  "Sur {{stats.bsojournalsnbworks}} travaux dans HAL, {{stats.bsojournalsnbworksfoundinbso}} ont été trouvés dans le BSO.",
  "Le corpus couvre {{stats.bsojournalsnbjournals}} revues (version {{stats.bsojournalsbsoversion}}).",
]
plots = ["journals", "journals_hal"]

[[sections]]
title = "Carte des collaborations internationales"
new_page = true
paragraphs = ["{{stats.collaborationsnb}} collaborations concernent {{stats.institutionsnb}} institutions dans {{stats.countriesnb}} pays."]
plots = ["collaboration_map_world"]

[[sections]]
title = "Carte des collaborations Européennes"
new_page = true
plots = ["collaboration_map_europe"]

[[sections]]
title = "Collaborations internationales par établissements"
new_page = true
plots = ["collaboration_names"]

[[sections]]
title = "Collaborations avec le secteur privé"
new_page = true
plots = ["private_sector_collaborations"]

[[sections]]
title = "Publications liées à des projets européens"
new_page = true
plots = ["european_projects"]

[[sections]]
title = "Publications liées à des projets ANR"
plots = ["anr_projects"]

[[sections]]
title = "Jeux de données partagés"
new_page = true
text = "Un guichet unique est à votre disposition pour vous accompagner sur toutes les questions en lien avec les données de la recherche."

[[sections]]
title = "Les atouts du Laboratoire dans son engagement pour la science ouverte"
new_page = true
text = ""

[[sections]]
title = "Préconisations, pour aller plus loin"
text = ""
