[report]
title = "Publications & Partenariats"
template = "pubpart"
author = "Direction des bibliothèques, de l'information et de la science ouverte"

[[sections]]
title = "Données"
paragraphs = [
  "Ce document présente les collaborations scientifiques sur la période {{config.year}} de : {{config.entities_full_name}}.",
  "Les données utilisées proviennent de la base OpenAlex, une source ouverte qui recense les publications des institutions de recherche dans le monde.",
  "Par défaut, toutes les composantes des institutions sont prises en compte : laboratoires, facultés, écoles, départements, instituts, etc.",
  "Cette approche permet d’avoir une vision complète des échanges entre les deux institutions, en intégrant toutes les entités qui en dépendent.",
  "La synthèse ci-dessous propose une analyse quantitative des co-publications de {{config.entities_full_name}}. Nous proposons également une analyse du potentiel de co-publication à partir des thématiques de recherche partagées entre les deux institutions.",
]

[[sections]]
title = "Principales thématiques de recherches identifiées"
new_page = true
missing = "error"
plots = ["topics_collaborations"]
figure_notes = ["{{stats.topicscollaborationsinfo}}"]
[sections.plot_captions]
topics_collaborations = "Principales thématiques de recherche identifiées dans les co-publications de {{config.entities_acronym}}, pour la période {{config.year}} (OpenAlex)"

[[sections]]
title = "Potentiel de collaboration identifié"
new_page = true
missing = "error"
plots = ["topics_potential_collaborations"]
figure_notes = ["{{stats.topicspotentialcollaborationsinfo}}"]
after_plots = ["Le potentiel de collaboration représente la capacité ou l’opportunité pour les deux institutions de travailler ensemble sur des sujets de recherche communs. Il est évalué en fonction de plusieurs facteurs :"]
bullets = [
  "la fréquence des thématiques de recherche dans les travaux de chaque institution ;",
  "le taux de collaboration actuel : évalué à partir de l’importance actuelle de la collaboration des institutions sur ce sujet.",
]
closing_paragraphs = ["Un score de potentiel de collaboration élevé indique que le sujet est d’intérêt pour les deux institutions, mais qu’il y a encore une marge pour renforcer leur coopération. Cela permet d’identifier les domaines où des collaborations supplémentaires pourraient être particulièrement bénéfiques et stratégiques."]
[sections.plot_captions]
topics_potential_collaborations = "Principales thématiques de recherche identifiées dans les publications de {{config.entities_acronym}} (co-publications exclues), pondérées par les thématiques des co-publications, pour la période {{config.year}} (OpenAlex)"

[[sections]]
title = "Top 25 des structures internes avec le plus de co-publications"
new_page = true
missing = "error"
plots = ["institutions_lineage_collaborations"]
figure_notes = ["{{stats.institutionslineagecollaborationsinfo}}"]
[sections.plot_captions]
institutions_lineage_collaborations = "Entités de la structure de référence avec le plus grand nombre de co-publications avec l’entité comparée, pour la période {{config.year}} (OpenAlex)"

[[sections]]
title = "Top 25 des co-publications par nombre de citations normalisées"
new_page = true
missing = "error"
plots = ["works_collaborations_citationsnormalized"]
figure_notes = ["{{stats.workscollaborationscitationsnormalizedinfo}}"]
after_plots = ["Cette métrique évalue la performance relative des citations de chaque publication par rapport à l’ensemble des autres travaux du même domaine, sur la même année. Cette approche permet de traiter de manière normalisée l’influence et l’impact de chaque publication. Pour plus de détails, voir la documentation d’OpenAlex : https://docs.openalex.org/api-entities/works/work-object#citation_normalized_percentile"]
[sections.plot_captions]
works_collaborations_citationsnormalized = "Co-publications entre {{config.entities_acronym}} sur la période {{config.year}}, ordonnées par une métrique de citation normalisée (OpenAlex)"

[[sections]]
title = "Top 25 des co-publications par nombre de citations"
new_page = true
missing = "error"
plots = ["works_collaborations_citationscount"]
figure_notes = ["{{stats.workscollaborationscitationscountinfo}}"]
[sections.plot_captions]
works_collaborations_citationscount = "Co-publications entre {{config.entities_acronym}} sur la période {{config.year}}, ordonnées par le nombre de citations (OpenAlex)"
